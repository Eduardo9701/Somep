# ========================================================
# SOMEP - SOCIEDAD MEXICANA DE PÉPTIDOS
# Configuración del Catálogo Educativo de Péptidos y Moléculas
# ========================================================

server.port=8080
server.servlet.context-path=

# Configuración de Internacionalización y Codificación UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Conexión a Base de Datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/somep_catalogo?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:sasa1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Servir Frontend Estático desde Spring Boot
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Configuración de Sesión y Cookies de Seguridad
server.servlet.session.timeout=1d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Tamaño de Carga de Archivos Multipart (Imágenes)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Configuración de Logging
logging.level.root=INFO
logging.level.com.somep.catalogo=DEBUG
