<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrativo — SOMEP</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-somep.svg">
  <link rel="stylesheet" href="/css/admin.css?v=1.0.1">
</head>
<body class="login-page">

  <main class="login-card" role="main">
    <header class="login-header">
      <img src="/assets/logo-somep.svg" alt="Logotipo SOMEP" class="login-logo" onerror="this.onerror=null; this.src='/assets/logo-somep.jpeg';">
      <h1 class="login-title">Acceso administrativo</h1>
      <p class="login-subtitle">Gestión del Catálogo Científico e Institucional</p>
    </header>

    <div id="login-alert" class="alert alert-danger" role="alert" aria-live="polite"></div>

    <form id="admin-login-form" class="login-form" novalidate>
      <div class="form-group">
        <label for="username" class="form-label">Usuario o correo electrónico</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-input" 
          placeholder="ej. admin o admin@somep.org.mx" 
          autocomplete="username" 
          required 
          autofocus>
        <div id="username-error" class="field-error">Por favor ingresa tu usuario o correo.</div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="••••••••••••" 
          autocomplete="current-password" 
          required>
        <div id="password-error" class="field-error">Por favor ingresa tu contraseña.</div>
      </div>

      <button type="submit" id="btn-submit" class="btn btn-primary btn-block">
        <span id="btn-text">Iniciar sesión</span>
        <span id="btn-spinner" class="spinner" style="display: none;" aria-hidden="true"></span>
      </button>
    </form>

    <footer class="login-footer-links">
      <a href="/index.html">← Volver al portal público de SOMEP</a>
    </footer>
  </main>

  <script src="/js/admin-login.js?v=1.0.1"></script>
</body>
</html>
